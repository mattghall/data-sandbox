name: Deploy data.trailmatt.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-data-trailmatt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
      S3_BUCKET: trailmatt-data
      CLOUDFRONT_DISTRIBUTION_ID: E3I8EKMDIEBEET
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout hinge-prompts
        uses: actions/checkout@v4
        with:
          repository: mattghall/hinge-prompts
          path: hinge-src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync data-sandbox to S3 (mirror with delete)
        run: |
          aws s3 sync . "s3://${S3_BUCKET}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "hinge/*" \
            --exclude "hinge-src/*"

      - name: Sync hinge-prompts to /hinge (mirror with delete)
        run: |
          aws s3 sync hinge-src/ "s3://${S3_BUCKET}/hinge" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
